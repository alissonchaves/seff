[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-seff"
version = "0.1.0"
description = "Report CPU, memory and GPU efficiency for Slurm jobs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Alisson Chaves"}]
dependencies = []

[project.scripts]
seff = "seff:main"

[tool.setuptools]
py-modules = ["seff", "seff_monitor", "seff_web"]
