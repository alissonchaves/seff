<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>seff live metrics</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{font:15px system-ui,sans-serif;margin:0;background:#f4f7fb;color:#17202a}
    .container{max-width:1100px;margin:0 auto;padding:2rem 1rem}.hero{background:#172b4d;color:#fff;padding:1.5rem 0;box-shadow:0 2px 8px #0002}
    h1{margin:0;font-size:2rem}.subtitle{margin:.35rem 0 0;color:#cbd7eb}.owner{margin:1.5rem 0 .5rem;font-size:1.1rem;font-weight:600}
    input,button{font:inherit;padding:.6rem .8rem;border:1px solid #c8d1df;border-radius:5px;background:#fff}button{cursor:pointer;background:#2f6fed;color:#fff;border-color:#2f6fed}
    button:hover{background:#2458bc}.table-wrap{overflow-x:auto;margin-top:1rem;background:#fff;border:1px solid #dce3ed;border-radius:8px;box-shadow:0 2px 8px #172b4d12}
    table{width:100%;border-collapse:collapse}th,td{padding:.85rem;text-align:left;border-bottom:1px solid #e7ecf3;white-space:nowrap}th{background:#eef3fa;color:#41536d;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;white-space:normal;line-height:1.15;min-width:5.5rem}.alloc-group{display:flex;flex-wrap:nowrap;gap:.4rem;min-width:11rem}.alloc-badge{display:inline-block;padding:.2rem .3rem;border-radius:5px;font-size:.78rem;font-weight:700;line-height:1.1}.metric-group{display:flex;flex-direction:column;gap:.3rem;min-width:8rem}.metric{padding:.22rem .45rem;border-radius:4px;font-size:.9rem;line-height:1.2}.metric-label{display:inline-block;width:3.5rem;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.metric-cpu{background:transparent;color:#315bb5}.metric-memory{background:transparent;color:#7046ad}.metric-gpu{background:transparent;color:#99620b}.submit-line{white-space:nowrap;overflow-wrap:normal;word-break:normal;min-width:22rem;line-height:1.35}
    tr:last-child td{border-bottom:0}tr:hover td{background:#f8fbff}.job{font-weight:600;color:#2458bc}.state{display:inline-block;padding:.2rem .5rem;border-radius:999px;background:#e4f7ec;color:#147a3d;font-size:.78rem;font-weight:600}.empty{text-align:center;color:#66758a;padding:2rem}
    #status{color:#666}.error{color:#a00}
  </style>
</head>
<body>
  <div class="hero"><div class="container"><h1>seff live metrics</h1><p class="subtitle">Live Slurm resource usage</p></div></div>
  <div class="container">
  <div class="owner" id="owner">Owner: —</div>
  <h2>Running jobs</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Node</th><th>Job ID</th><th>Job name</th><th>Status</th><th>Alloc</th><th>CPU</th><th>Memory</th><th>GPU util/mem</th><th>Submit line</th></tr></thead>
      <tbody id="jobs"><tr><td class="empty" colspan="9">Loading jobs...</td></tr></tbody>
    </table>
  </div>
  <p id="status">Refresh interval: 10 seconds.</p>
  </div>
  <script>
    const q=id=>document.getElementById(id);let timer,snapshots={};
    const ownerMatch=location.pathname.match(/\/~([^/]+)/);q('owner').textContent='Owner: '+(ownerMatch?decodeURIComponent(ownerMatch[1]):'—');
    function formatMemory(kb){if(!kb)return '—';let n=kb,u='KB';if(n>1024){n/=1024;u='MB'}if(n>1024){n/=1024;u='GB'}return n.toFixed(2)+' '+u}
    async function refresh(){try{const r=await fetch('metrics-index.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('metrics index not found');const index=await r.json();
      const entries=Object.values(index).sort((a,b)=>a.job_id.localeCompare(b.job_id)||a.node.localeCompare(b.node));
      const activeFiles=new Set(entries.map(e=>e.file));
      Object.keys(snapshots).forEach(file=>{if(!activeFiles.has(file))delete snapshots[file]});
      await Promise.all(entries.filter(e=>!snapshots[e.file]||snapshots[e.file].updated_at!==e.updated_at).map(async e=>{
        const response=await fetch(e.file+'?'+Date.now(),{cache:'no-store'});if(response.ok)snapshots[e.file]=await response.json();
      }));
      const data=entries.map(e=>({meta:e,data:snapshots[e.file]})).filter(x=>x.data);
      q('jobs').innerHTML=data.length?data.map(({meta:d,data:x})=>`<tr><td>${d.node}</td><td class="job">${d.job_id}</td><td>${x.job_name||'—'}</td><td><span class="state">RUNNING</span></td><td><div class="alloc-group"><span class="alloc-badge metric-cpu">C: ${x.cpus||'—'}</span><span class="alloc-badge metric-memory">M: ${formatMemory(x.allocated_memory_kb||x.memory_limit_kb)}</span><span class="alloc-badge metric-gpu">G: ${(x.allocated_gpus??(x.gpu&&x.gpu.count))||'—'}</span></div></td><td><div class="metric metric-cpu">${x.cpu_percent==null?'—':x.cpu_percent.toFixed(2)+'%'}</div></td><td><div class="metric metric-memory">${formatMemory(x.memory_used_kb)}</div></td><td><div class="metric metric-gpu">${x.gpu&&x.gpu.utilization_percent!=null?x.gpu.utilization_percent.toFixed(2)+'%':'—'} / ${x.gpu&&x.gpu.memory_used_mb!=null?x.gpu.memory_used_mb+' MB':'—'}</div></td><td class="submit-line">${x.submit_line||'—'}</td></tr>`).join(''):'<tr><td class="empty" colspan="9">No running jobs.</td></tr>';
      q('status').textContent=data.length+' node(s) · checked '+new Date().toLocaleTimeString();q('status').className='';
    }catch(e){q('jobs').innerHTML='<tr><td class="empty error" colspan="9">'+e.message+'</td></tr>';q('status').className='error'}}
    refresh();timer=setInterval(refresh,1000);
  </script>
</body>
</html>
