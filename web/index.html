<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>seff live metrics</title>
  <style>
    body{font:16px system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#17202a}
    input,button{font:inherit;padding:.5rem}.table-wrap{overflow-x:auto;margin-top:1.5rem}
    table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:.7rem;text-align:left;border-bottom:1px solid #ddd;white-space:nowrap}
    th{background:#f2f2f2}.empty{text-align:center;color:#666;padding:1.5rem}
    #status{color:#666}.error{color:#a00}
  </style>
</head>
<body>
  <h1>seff live metrics</h1>
  <h2>Running jobs</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Node</th><th>Job ID</th><th>CPU</th><th>Memory</th><th>GPU utilization</th><th>GPU memory</th></tr></thead>
      <tbody id="jobs"><tr><td class="empty" colspan="6">Loading jobs...</td></tr></tbody>
    </table>
  </div>
  <p id="status">Refresh interval: 10 seconds.</p>
  <script>
    const q=id=>document.getElementById(id);let timer,snapshots={};
    function formatMemory(kb){if(!kb)return '—';let n=kb,u='KB';if(n>1024){n/=1024;u='MB'}if(n>1024){n/=1024;u='GB'}return n.toFixed(2)+' '+u}
    async function refresh(){try{const r=await fetch('metrics-index.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('metrics index not found');const index=await r.json();
      const entries=Object.values(index).sort((a,b)=>a.job_id.localeCompare(b.job_id)||a.node.localeCompare(b.node));
      const activeFiles=new Set(entries.map(e=>e.file));
      Object.keys(snapshots).forEach(file=>{if(!activeFiles.has(file))delete snapshots[file]});
      await Promise.all(entries.filter(e=>!snapshots[e.file]||snapshots[e.file].updated_at!==e.updated_at).map(async e=>{
        const response=await fetch(e.file+'?'+Date.now(),{cache:'no-store'});if(response.ok)snapshots[e.file]=await response.json();
      }));
      const data=entries.map(e=>({meta:e,data:snapshots[e.file]})).filter(x=>x.data);
      q('jobs').innerHTML=data.length?data.map(({meta:d,data:x})=>`<tr><td>${d.node}</td><td>${d.job_id}</td><td>${x.cpu_percent==null?'—':x.cpu_percent.toFixed(2)+'%'}</td><td>${formatMemory(x.memory_used_kb)}</td><td>${x.gpu&&x.gpu.utilization_percent!=null?x.gpu.utilization_percent.toFixed(2)+'%':'—'}</td><td>${x.gpu&&x.gpu.memory_used_mb!=null?x.gpu.memory_used_mb+' MB':'—'}</td></tr>`).join(''):'<tr><td class="empty" colspan="6">No running jobs.</td></tr>';
      q('status').textContent=data.length+' node(s) · checked '+new Date().toLocaleTimeString();q('status').className='';
    }catch(e){q('jobs').innerHTML='<tr><td class="empty error" colspan="6">'+e.message+'</td></tr>';q('status').className='error'}}
    refresh();timer=setInterval(refresh,1000);
  </script>
</body>
</html>
